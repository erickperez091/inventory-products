server:
  port: 9080
spring:
  application:
    name: inventory-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: s3cr3t_passw0rd
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
